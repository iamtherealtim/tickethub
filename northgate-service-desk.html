<style>
  html,body{height:100%}

  articles: [
    { id:'kb1', title:'Reset your Northgate password', cat:'Accounts & access', status:'Published', author:'a5', updated:ago(72), views:2841, up:412, down:19, tags:['password','sso'],
      body:`<p>You can reset your own password at any time from the identity portal — no ticket needed. The change applies to email, VPN, and every app behind single sign-on within about a minute.</p><h2>Reset it yourself</h2><ul><li>Go to <code>id.northgate.co/reset</code> on any device.</li><li>Enter your work email and approve the push notification on your phone.</li><li>Choose a new passphrase of at least 14 characters.</li></ul><h2>If the push never arrives</h2><p>Your enrolled device may have changed. Open a ticket with the Service Desk and an analyst will re-enrol you after an identity check. Bring photo ID if you are on site.</p><h2>Password rules</h2><ul><li>14 characters minimum, no expiry</li><li>Cannot reuse your last 5 passphrases</li><li>Blocked if it appears in a known breach list</li></ul>` },
    { id:'kb2', title:'Connect to VPN from a personal network', cat:'Network', status:'Published', author:'a3', updated:ago(30), views:1930, up:288, down:41, tags:['vpn','remote'],
      body:`<p>Northgate VPN uses certificate-based authentication. The certificate installs automatically the first time you connect from a managed laptop.</p><h2>First connection</h2><ul><li>Open the Northgate VPN client from your applications folder.</li><li>Select the gateway closest to you — <code>tor-vpn-01</code> for Canada, <code>ams-vpn-02</code> for Europe.</li><li>Approve the MFA prompt.</li></ul><h2>Common errors</h2><p><code>Error 812</code> means your certificate has expired. Reconnect on the office network once, or raise a ticket and we will push a fresh certificate.</p><p>Slow throughput on home Wi-Fi is usually a 2.4GHz band issue. Move to the 5GHz SSID before opening a ticket.</p>` },
    { id:'kb3', title:'Request software that is not in the catalog', cat:'Software', status:'Published', author:'a6', updated:ago(190), views:864, up:120, down:8, tags:['software','procurement'],
      body:`<p>Anything not listed in the service catalog needs a security and licensing review before it can be installed. Plan for three to five business days.</p><h2>What to include in your request</h2><ul><li>Vendor name and product page</li><li>What the tool does that catalog software cannot</li><li>Whether it stores customer or employee data</li><li>Your cost centre for the licence</li></ul><h2>What happens next</h2><p>Applications reviews the request, Security reviews data handling, and your manager approves the spend. You will see each approval on the ticket as it clears.</p>` },
    { id:'kb4', title:'Set up a new starter on day one', cat:'Onboarding', status:'Published', author:'a1', updated:ago(14), views:1204, up:203, down:6, tags:['onboarding','hr'],
      body:`<p>Hiring managers raise the onboarding request at least five working days before the start date so hardware can be imaged and shipped.</p><h2>What we provision</h2><ul><li>Laptop, dock, and one external monitor</li><li>Email, calendar, and directory entry</li><li>Access to the apps assigned to the person's role profile</li></ul><h2>Day one</h2><p>The starter collects their laptop from the Service Desk on floor 3, or receives it by courier if remote. Sign-in uses the temporary passphrase sent to the hiring manager.</p>` },
    { id:'kb5', title:'Printing from a personal device', cat:'Hardware', status:'Published', author:'a4', updated:ago(240), views:512, up:64, down:22, tags:['printing'],
      body:`<p>Personal devices cannot print directly to office printers. Use secure release printing instead.</p><h2>How it works</h2><ul><li>Email your document to <code>print@northgate.co</code> from your work address.</li><li>Tap your badge on any printer within four hours.</li><li>Select the job and press release.</li></ul><p>Jobs older than four hours are deleted automatically.</p>` },
    { id:'kb6', title:'Recognising a phishing email', cat:'Security', status:'Published', author:'a5', updated:ago(56), views:1670, up:340, down:5, tags:['security','phishing'],
      body:`<p>Report anything suspicious with the Report Phish button in Outlook. Reporting a legitimate message costs nothing; ignoring a real one can cost a great deal.</p><h2>Signals worth a second look</h2><ul><li>Urgency about money, payroll, or gift cards</li><li>A reply-to address that differs from the sender</li><li>Links that resolve to a domain you do not recognise</li><li>A first-time sender asking you to break a process</li></ul><h2>If you already clicked</h2><p>Disconnect from the network and call the Service Desk on extension 4400. Speed matters more than tidiness here.</p>` },
    { id:'kb7', title:'Meeting room AV troubleshooting', cat:'Hardware', status:'Draft', author:'a4', updated:ago(6), views:0, up:0, down:0, tags:['av','rooms'],
      body:`<p>Draft — pending review by Facilities.</p><h2>No display on the room screen</h2><ul><li>Wake the panel with the touch controller before connecting.</li><li>Use the USB-C cable at the table, not the HDMI spur.</li></ul>` }

function mkTicket(o){
  const created = o.created;
  const t = {
    id: o.id, subject: o.subject, requester: o.requester, agent: o.agent || null,
    group: o.group, status: o.status, priority: o.priority, type: o.type,
    category: o.category, source: o.source, site: DB.users.find(u=>u.id===o.requester)?.site || '—',
    created, updated: o.updated || created,
    frDue: o.frDue, resDue: o.resDue, respondedAt: o.respondedAt || null,
    resolvedAt: o.resolvedAt || null,
    tags: o.tags || [], assets: o.assets || [], tasks: o.tasks || [],
    csat: o.csat || null, escalated: !!o.escalated,
    conv: [{ kind:'description', by:o.requester, at:created, body:o.body, atts:o.atts||[] }].concat(o.conv||[])

  return t;
}

/* ---------- formatting ---------- */
const MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const pad = n => String(n).padStart(2,'0');
function esc(s=''){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtDate(d){ return `${d.getDate()} ${MONTHS[d.getMonth()]}, ${pad(d.getHours())}:${pad(d.getMinutes())}`; }
function fmtDay(d){ return `${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()}`; }
function durLabel(ms){
  const s = Math.abs(ms)/1000, m = Math.floor(s/60), h = Math.floor(m/60), d = Math.floor(h/24);
  if (d >= 1) return `${d}d ${h%24}h`;
  if (h >= 1) return `${h}h ${m%60}m`;
  return `${Math.max(m,0)}m`;
}
function relTime(d){
  const diff = Date.now() - d.getTime();
  if (diff < 0) return 'in ' + durLabel(diff);
  if (diff < 60000) return 'just now';
  return durLabel(diff) + ' ago';
}
function initials(name){ return name.split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase(); }

const AV = {
  brand:'bg-brand-50 text-brand border-brand-100',
  ink:'bg-[#E8EAEF] text-ink-500 border-[#D8DCE4]',
  violet:'bg-violet-50 text-violet border-[#DCD8F0]',
  signal:'bg-signal-50 text-signal border-signal-100',
  alert:'bg-alert-50 text-alert border-alert-100'
};
function avatar(id, size=28, cls=''){
  const p = person(id);
  const s = size <= 24 ? 'text-[10px]' : size <= 30 ? 'text-[11px]' : 'text-[13px]';
  return `<span class="inline-flex items-center justify-center rounded-full border font-semibold ${s} ${AV[p.color]||AV.ink} ${cls}"
    style="width:${size}px;height:${size}px" title="${esc(p.name)}">${initials(p.name)}</span>`;
}

const PRIORITY = {
  Urgent:{ dot:'bg-alert',    text:'text-alert',    bg:'bg-alert-50',   rank:0 },
  High:  { dot:'bg-signal',   text:'text-signal',   bg:'bg-signal-50',  rank:1 },
  Medium:{ dot:'bg-[#4C6EF5]',text:'text-[#3B5BDB]',bg:'bg-[#EDF2FF]',  rank:2 },
  Low:   { dot:'bg-[#98A1B0]',text:'text-muted',    bg:'bg-[#EFF1F5]',  rank:3 }
};
const STATUS = {
  New:     { cls:'bg-ink text-white border-ink' },
  Open:    { cls:'bg-signal-50 text-signal border-signal-100' },
  Pending: { cls:'bg-violet-50 text-violet border-[#DCD8F0]' },
  Resolved:{ cls:'bg-brand-50 text-brand border-brand-100' },
  Closed:  { cls:'bg-[#EFF1F5] text-muted border-line' }
};
const OPEN_STATES = ['New','Open','Pending'];
const isOpen = t => OPEN_STATES.includes(t.status);

function sla(t){
  const done = !isOpen(t);
  const total = t.resDue - t.created;
  const elapsed = (done ? (t.resolvedAt||t.resDue) : new Date()) - t.created;
  const pct = Math.max(0, Math.min(100, (elapsed/total)*100));
  const remaining = t.resDue - Date.now();
  let state = 'ok';
  if (done) state = (t.resolvedAt && t.resolvedAt <= t.resDue) ? 'met' : 'missed';
  else if (remaining <= 0) state = 'breached';
  else if (pct >= 75) state = 'warn';
  return { pct, remaining, state, done };
}
const SLA_COLOR = { ok:'#0E7C6B', warn:'#B8760B', breached:'#BC332D', met:'#0E7C6B', missed:'#BC332D' };
function slaLabel(t){
  const s = sla(t);
  if (s.done) return s.state === 'met' ? 'Met' : 'Missed';
  return (s.remaining <= 0 ? 'Over by ' : '') + durLabel(s.remaining);
}
function statusChip(s){
  return `<span class="inline-flex items-center h-[22px] px-2 rounded-md border text-[11px] font-semibold tracking-wide ${STATUS[s].cls}">${s}</span>`;
}
function priorityTag(p){
  const c = PRIORITY[p];
  return `<span class="inline-flex items-center gap-1.5 text-[12px] font-medium ${c.text}"><i class="led ${c.dot}"></i>${p}</span>`;
}
function tagPill(t){
  return `<span class="inline-flex items-center h-[20px] px-1.5 rounded bg-[#EFF1F5] text-[11px] text-muted font-mono">${esc(t)}</span>`;
}

/* Signature: breach horizon — every open ticket placed on a 12-hour runway */
function breachHorizon(){
  const open = DB.tickets.filter(isOpen);
  const late = open.filter(t => sla(t).remaining <= 0).sort((a,b)=>a.resDue-b.resDue);
  const soon = open.filter(t => { const r = sla(t).remaining; return r > 0 && r <= 12*H; }).sort((a,b)=>a.resDue-b.resDue);
  const beyond = open.length - late.length - soon.length;

  const marks = [0,3,6,9,12].map(h => `<div class="absolute top-0 bottom-0 border-l border-line" style="left:${(h/12)*100}%">
      <span class="absolute -top-[18px] -translate-x-1/2 font-mono text-[10px] text-faint">${h===0?'now':'+'+h+'h'}</span></div>`).join('');

  const pips = soon.map(t => {
    const r = sla(t).remaining / H;
    const left = Math.min(98, (r/12)*100);
    const p = PRIORITY[t.priority];
    return `<button data-open="${t.id}" title="${esc(t.id)} · ${esc(t.subject)} · due in ${durLabel(sla(t).remaining)}"
      class="absolute -translate-x-1/2 top-1/2 -translate-y-1/2 w-2.5 h-2.5 rounded-full ${p.dot} ring-[3px] ring-white hover:scale-150 transition" style="left:${left}%"></button>`;
  }).join('');

  const lateList = late.slice(0,4).map(t => `<button data-open="${t.id}" class="flex items-center gap-2 w-full text-left group">
      <i class="led ${PRIORITY[t.priority].dot}"></i>
      <span class="font-mono text-[11px] text-alert">${t.id}</span>
      <span class="text-[12px] text-ink-500 truncate flex-1 group-hover:underline">${esc(t.subject)}</span>
      <span class="font-mono text-[11px] text-alert tick">+${durLabel(sla(t).remaining)}</span>
    </button>`).join('');

  return card(`
    ${cardHead('Breach horizon', `<span class="text-muted">${soon.length} due in 12h · <span class="text-alert font-semibold">${late.length} past due</span> · ${beyond} beyond</span>`)}
    <div class="p-4 pt-7">
      <div class="flex gap-3">
        <div class="w-[86px] shrink-0 rounded-lg stripe border border-alert-100 grid place-items-center h-12">
          <span class="font-mono text-[15px] text-alert">${late.length}</span>
        </div>
        <div class="relative flex-1 h-12 rounded-lg border border-line bg-canvas overflow-visible">${marks}${pips}
          ${soon.length===0 ? '<span class="absolute inset-0 grid place-items-center text-[12px] text-faint">Nothing due in the next 12 hours</span>' : ''}
        </div>
      </div>
      ${late.length ? `<div class="mt-4 pt-3 border-t border-line space-y-2">${lateList}
        ${late.length>4 ? `<button data-action="viewOverdue" class="text-[12px] text-brand font-medium hover:underline">See all ${late.length} past due</button>`:''}
      </div>` : ''}
    </div>`);
}

  const max = Math.max(...created, ...resolved);
  const bars = days.map((d,i) => {
    const hc = (created[i]/max)*100, hr = (resolved[i]/max)*100;
    return `<div class="flex-1 flex flex-col items-center gap-1.5 group">
      <div class="w-full flex items-end justify-center gap-[3px] h-[112px]">
        <div class="w-[9px] rounded-t-[2px] bg-ink-600 group-hover:bg-ink transition-all" style="height:${hc}%" title="${created[i]} created"></div>
        <div class="w-[9px] rounded-t-[2px] bg-brand-100 group-hover:bg-brand transition-all" style="height:${hr}%" title="${resolved[i]} resolved"></div>
      </div>
      <span class="text-[10.5px] text-faint">${d}</span></div>`;
  }).join('');
  return card(`${cardHead('Ticket volume', `
      <span class="flex items-center gap-1.5 text-muted"><i class="w-2 h-2 rounded-sm bg-ink-600"></i>Created</span>

}

  const rated = DB.tickets.filter(t=>t.csat);
  const avg = rated.length ? (rated.reduce((s,t)=>s+t.csat.score,0)/rated.length) : 0;
  const dist = [5,4,3,2,1].map(n => ({ n, c: rated.filter(t=>t.csat.score===n).length }));
  const stars = n => Array.from({length:5},(_,i)=>`<span class="${i<Math.round(n)?'text-signal-400':'text-line'}">${icon('star','w-3.5 h-3.5 fill-current')}</span>`).join('');
  return card(`${cardHead('Satisfaction', `<span class="text-muted">${rated.length} responses</span>`)}
    <div class="p-4">
      <div class="flex items-baseline gap-2"><span class="font-mono text-[28px] text-ink tick">${avg.toFixed(1)}</span><span class="text-[12px] text-muted">/ 5</span></div>

      <div class="mt-4 space-y-1.5">${dist.map(d => `

}

  const view = SAVED_VIEWS.find(v=>v.id===STATE.savedView) || SAVED_VIEWS[0];
  let list = DB.tickets.filter(view.fn);
  if (f.q){
    const q = f.q.toLowerCase();
    list = list.filter(t => (t.id+' '+t.subject+' '+t.conv[0].body+' '+person(t.requester).name+' '+t.tags.join(' ')).toLowerCase().includes(q));
  }
  if (f.status)   list = list.filter(t=>t.status===f.status);
  if (f.priority) list = list.filter(t=>t.priority===f.priority);
  if (f.type)     list = list.filter(t=>t.type===f.type);
  if (f.group)    list = list.filter(t=>t.group===f.group);
  if (f.agent)    list = list.filter(t => f.agent==='none' ? !t.agent : t.agent===f.agent);
  const s = f.sort;
  list.sort((a,b)=>{
    if (s==='sla')      return a.resDue - b.resDue;
    if (s==='created')  return b.created - a.created;
    if (s==='updated')  return b.updated - a.updated;
    if (s==='priority') return PRIORITY[a.priority].rank - PRIORITY[b.priority].rank || a.resDue-b.resDue;
    return 0;
  });
  return list;
}

function donut(data){
  const total = data.reduce((s,d)=>s+d.v,0) || 1;
  let offset = 0;
  const arcs = data.map(d => {
    const frac = d.v/total, dash = frac*339.3;
    const seg = `<circle cx="60" cy="60" r="54" fill="none" stroke="${d.c}" stroke-width="12"
      stroke-dasharray="${dash} ${339.3-dash}" stroke-dashoffset="${-offset}" transform="rotate(-90 60 60)"><title>${d.k}: ${d.v}</title></circle>`;
    offset += dash; return seg;
  }).join('');
  return `<div class="flex items-center gap-5 flex-wrap">
    <svg viewBox="0 0 120 120" class="w-[120px] h-[120px] shrink-0"><circle cx="60" cy="60" r="54" fill="none" stroke="#EEF0F4" stroke-width="12"/>${arcs}
      <text x="60" y="58" text-anchor="middle" class="font-mono" font-size="19" fill="#10141C">${total}</text>
      <text x="60" y="72" text-anchor="middle" font-size="8.5" fill="#8B93A3">tickets</text></svg>
    <div class="space-y-1.5 flex-1 min-w-[140px]">${data.map(d=>`
      <div class="flex items-center gap-2 text-[12.5px]"><i class="w-2.5 h-2.5 rounded-sm" style="background:${d.c}"></i>
        <span class="text-ink-500 flex-1">${d.k}</span><span class="font-mono text-muted">${d.v}</span>
        <span class="font-mono text-faint w-9 text-right">${Math.round(d.v/total*100)}%</span></div>`).join('')}</div></div>`;
}

function viewReports(){
  const cats = {};
  DB.tickets.forEach(t => cats[t.category] = (cats[t.category]||0)+1);
  const palette = ['#0E7C6B','#B8760B','#5A4FB0','#BC332D','#4C6EF5','#8B93A3','#0B6558','#E9A23B'];
  const catData = Object.entries(cats).sort((a,b)=>b[1]-a[1]).map(([k,v],i)=>({k,v,c:palette[i%palette.length]}));
  const srcs = {};
  DB.tickets.forEach(t => srcs[t.source] = (srcs[t.source]||0)+1);
  const srcData = Object.entries(srcs).sort((a,b)=>b[1]-a[1]);
  const maxSrc = Math.max(...srcData.map(s=>s[1]));

  const groupPerf = DB.groups.map(g => {
    const ts = DB.tickets.filter(t=>t.group===g.id);
    const resolved = ts.filter(t=>t.resolvedAt);
    const avg = resolved.length ? resolved.reduce((s,t)=>s+(t.resolvedAt-t.created),0)/resolved.length : 0;
    const met = resolved.filter(t=>t.resolvedAt<=t.resDue).length;
    return { g, n:ts.length, avg, pct: resolved.length?Math.round(met/resolved.length*100):100 };
  }).sort((a,b)=>b.n-a.n);
  const maxAvg = Math.max(1,...groupPerf.map(p=>p.avg));

  return `<div class="p-5 max-w-[1400px] mx-auto fade-in">
    ${pageHead('Reports','Last 30 days · all groups', selectBox('range','30',[['7','Last 7 days'],['30','Last 30 days'],['90','Last quarter']]) + btn('Export','export','ghost','ext'))}
    <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-4">
      ${kpi('Median first response','42m','Target 1h','brand')}
      ${kpi('Median resolution','6h 20m','Down 14% on last month','brand')}
      ${kpi('SLA attainment','91%','Resolution, all priorities','signal')}
      ${kpi('Reopen rate','4.2%','12 of 286 resolved')}
    </div>
    <div class="grid lg:grid-cols-2 gap-4 mb-4">
      ${card(`${cardHead('Where tickets come from')}<div class="p-4 space-y-2.5">${srcData.map(([k,v])=>`
        <div class="flex items-center gap-3"><span class="text-[12.5px] text-ink-500 w-[74px]">${k}</span>
          <div class="flex-1 h-5 rounded bg-canvas overflow-hidden"><div class="h-full bg-ink-600 rounded" style="width:${(v/maxSrc)*100}%"></div></div>
          <span class="font-mono text-[12px] text-muted w-6 text-right">${v}</span></div>`).join('')}</div>`)}
      ${card(`${cardHead('Category mix')}<div class="p-4">${donut(catData)}</div>`)}
    </div>
    ${card(`${cardHead('Group performance', '<span class="text-muted">Avg resolution time and SLA attainment</span>')}
      <div class="p-4 space-y-3.5">${groupPerf.map(p=>`
        <div>
          <div class="flex items-center justify-between text-[12.5px] mb-1.5">
            <span class="font-medium text-ink">${esc(p.g.name)}</span>
            <span class="flex items-center gap-3 font-mono text-[11.5px]">
              <span class="text-muted">${p.n} tickets</span>
              <span class="text-ink-500">${p.avg?durLabel(p.avg):'—'}</span>
              <span class="${p.pct>=90?'text-brand':p.pct>=75?'text-signal':'text-alert'}">${p.pct}% SLA</span></span>
          </div>
          <div class="h-2 rounded-full bg-canvas overflow-hidden"><div class="h-full rounded-full bg-brand" style="width:${(p.avg/maxAvg)*100}%"></div></div>
        </div>`).join('')}</div>`)}
  </div>`;
}

function toast(msg, kind='ok'){
  const tones = { ok:'bg-ink text-white', warn:'bg-signal text-white', bad:'bg-alert text-white' };
  const el = document.createElement('div');
  el.className = `pop-in flex items-center gap-2 h-10 px-3.5 rounded-xl shadow-pop text-[13px] font-medium ${tones[kind]}`;
  el.innerHTML = `${icon(kind==='ok'?'check':'warn','w-4 h-4')}<span>${esc(msg)}</span>`;
  $('#toastRoot').appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transform='translateY(6px)'; setTimeout(()=>el.remove(),200); }, 2600);
}

const FORMS = {};
function field(f){
  const base = 'w-full h-9 px-2.5 rounded-lg border border-line bg-white text-[13px] text-ink placeholder:text-faint focus:border-brand';
  let ctl;
  if (f.type==='textarea') ctl = `<textarea name="${f.k}" rows="${f.rows||4}" placeholder="${esc(f.ph||'')}" class="w-full px-2.5 py-2 rounded-lg border border-line text-[13px] leading-relaxed placeholder:text-faint focus:border-brand">${esc(f.value||'')}</textarea>`;
  else if (f.type==='select') ctl = `<select name="${f.k}" class="${base}">${f.opts.map(o=>{const [v,l]=Array.isArray(o)?o:[o,o];return `<option value="${esc(v)}" ${String(v)===String(f.value||'')?'selected':''}>${esc(l)}</option>`;}).join('')}</select>`;
  else ctl = `<input name="${f.k}" type="${f.type||'text'}" value="${esc(f.value||'')}" placeholder="${esc(f.ph||'')}" class="${base}">`;
  return `<div class="${f.half?'sm:col-span-1':'sm:col-span-2'}">
    <label class="block text-[12px] font-medium text-ink-500 mb-1.5">${f.label}${f.required?'<span class="text-alert"> *</span>':''}</label>
    ${ctl}${f.hint?`<p class="text-[11.5px] text-faint mt-1">${f.hint}</p>`:''}</div>`;
}
function formModal({ title, sub, fields, submit='Save', onSubmit, width='max-w-lg' }){
  FORMS.current = onSubmit;
  openModal({ title, sub, width,
    body: `<form id="modalForm" class="grid sm:grid-cols-2 gap-3.5">${fields.map(field).join('')}</form>`,
    footer: `<button data-action="closeModal" class="h-9 px-3.5 rounded-lg border border-line text-[13px] font-medium text-ink-500 hover:bg-white">Cancel</button>
             <button data-action="submitForm" class="h-9 px-3.5 rounded-lg bg-brand hover:bg-brand-600 text-white text-[13px] font-semibold">${submit}</button>` });
}
function readForm(){
  const f = $('#modalForm'); if (!f) return {};
  const o = {}; new FormData(f).forEach((v,k)=>o[k]=String(v).trim()); return o;
}

    body:`<input id="paletteInput" placeholder="Type to search…" class="w-full h-10 px-3 rounded-lg border border-line text-[14px] mb-3 focus:border-brand">
          <div id="paletteResults" class="max-h-[340px] overflow-y-auto -mx-1"></div>` });
  paletteSearch('');

function paletteSearch(q){
  q = q.toLowerCase();
  const hits = [];
  NAV.forEach(n => { if (!q || n.label.toLowerCase().includes(q)) hits.push({ ic:n.icon, label:n.label, meta:'Page', act:['nav',n.view] }); });
  DB.tickets.forEach(t => { if (q && (t.id+t.subject).toLowerCase().includes(q)) hits.push({ ic:'inbox', label:t.subject, meta:t.id+' · '+t.status, act:['ticket',t.id] }); });
  DB.articles.forEach(a => { if (q && a.title.toLowerCase().includes(q)) hits.push({ ic:'book', label:a.title, meta:'Article · '+a.cat, act:['article',a.id] }); });
  DB.assets.forEach(a => { if (q && (a.id+a.name+a.serial).toLowerCase().includes(q)) hits.push({ ic:'server', label:a.name, meta:a.id+' · '+a.model, act:['asset',a.id] }); });
  DB.users.forEach(u => { if (q && u.name.toLowerCase().includes(q)) hits.push({ ic:'user', label:u.name, meta:u.dept+' · '+u.site, act:['user',u.id] }); });
  const res = $('#paletteResults'); if (!res) return;
  res.innerHTML = hits.length ? hits.slice(0,12).map(h=>`
    <button data-palette='${JSON.stringify(h.act)}' class="w-full flex items-center gap-3 px-3 h-11 rounded-lg hover:bg-canvas text-left">
      <span class="text-faint">${icon(h.ic,'w-4 h-4')}</span>
      <span class="text-[13px] text-ink truncate flex-1">${esc(h.label)}</span>
      <span class="font-mono text-[11px] text-faint shrink-0">${esc(h.meta)}</span></button>`).join('')
    : `<p class="px-3 py-6 text-center text-[13px] text-muted">Nothing matches “${esc(q)}”.</p>`;
}

   ============================================================ */
const SLA_HOURS = { Urgent:[0.25,4], High:[1,8], Medium:[4,48], Low:[8,120] };
function createTicket({ subject, body, requester, priority='Medium', type='Incident', category='Software', source='Portal', group='g1', agentId=null, tags=[] }){
  const kind = type==='Incident' ? 'INC' : 'SR';
  const [fr,res] = SLA_HOURS[priority];
  const created = new Date();
  const t = mkTicket({ id:nextId(kind), subject, body, requester, agent:agentId, group, status:'New',
    priority, type, category, source, created, frDue:ahead(fr), resDue:ahead(res), tags });
  DB.tickets.unshift(t);
  logActivity(`${t.id} created`, t.id);
  return t;
}

      { k:'priority', label:'Priority', type:'select', half:true, opts:['Urgent','High','Medium','Low'], value:'Medium' },
      { k:'group', label:'Group', type:'select', half:true, opts:DB.groups.map(g=>[g.id,g.name]) },
      { k:'agent', label:'Assign to', type:'select', opts:[['','Leave unassigned'],...DB.agents.filter(a=>a.active).map(a=>[a.id,a.name])] },

  const s = sla(t);
  return `<div class="max-w-[820px] mx-auto px-5 py-8 fade-in">
    <button data-pnav="mytickets" class="inline-flex items-center gap-1 text-[12.5px] text-muted hover:text-ink mb-4">${icon('back','w-3.5 h-3.5')} My tickets</button>

      </div>
      <h1 class="font-display text-[22px] font-semibold leading-snug">${esc(t.subject)}</h1>
      <div class="grid sm:grid-cols-3 gap-3 mt-4 pt-4 border-t border-line">

          <div class="text-[13px] mt-0.5 ${isOpen(t)&&s.remaining<0?'text-alert':'text-ink-500'}">${isOpen(t)?fmtDate(t.resDue):fmtDate(t.resolvedAt||t.updated)}</div></div>
      </div>
    </div>

    ${!isOpen(t) && !t.csat ? `<div class="mt-4 bg-white border border-brand-100 rounded-xl p-5">

          ${icon('star','w-5 h-5 fill-current')}</button>`).join('')}</div></div>` : ''}
    ${t.csat ? `<div class="mt-4 bg-brand-50 border border-brand-100 rounded-xl p-4 flex items-center gap-3">
      <div class="flex gap-0.5 text-signal-400">${Array.from({length:5},(_,i)=>icon('star',`w-4 h-4 ${i<t.csat.score?'fill-current':'text-brand-100 fill-current'}`)).join('')}</div>
      <span class="text-[13px] text-ink-500">Thanks for rating this ${t.csat.score} out of 5.</span></div>` : ''}

    <div class="mt-4 space-y-3">${pub.map((c,i)=>convEntry(t,c,i)).join('')}</div>

    ${isOpen(t)?`<div class="mt-4 bg-white border border-line rounded-xl shadow-card p-4">
      <label class="block text-[12.5px] font-medium text-ink-500 mb-2">Add to this request</label>
      <textarea id="portalReply" rows="4" placeholder="Anything new — an error message, a screenshot, or a nudge if it is now urgent."

function catalogRequestModal(itemId, onBehalf){
  const it = DB.catalog.find(c=>c.id===itemId);
  const fields = [
    ...(onBehalf ? [{ k:'requester', label:'Requesting for', type:'select', opts:DB.users.map(u=>[u.id,`${u.name} — ${u.dept}`]) }] : []),
    ...it.fields.map(f=>({ k:f.k, label:f.label, type:f.type, opts:f.opts, half:f.type!=='textarea' })),
    { k:'notes', label:'Anything else we should know?', type:'textarea', rows:3, ph:'Optional' }
  ];
  formModal({ title:it.name, sub:`${it.sla} · ${it.approval==='None'?'No approval needed':it.approval+' approval required'}`,
    fields, submit:'Submit request', width:'max-w-xl',
    onSubmit(v){
      const requester = onBehalf ? v.requester : STATE.requester;
      const detail = it.fields.map(f=>`${f.label}: ${v[f.k]||'—'}`).join('\n') + (v.notes?`\n\nNotes: ${v.notes}`:'');
      const t = createTicket({ subject:it.name, body:detail, requester, type:'Service request',
        category:it.cat==='Accounts & access'?'Access':it.cat==='Onboarding'?'Access':it.cat, priority:'Medium', source:'Portal', tags:[it.id] });
      if (it.approval !== 'None'){ t.status='Pending'; addSystemNote(t, `Waiting on ${it.approval} approval`); }
      closeModal();
      if (onBehalf){ go('ticket', t.id); toast(`${t.id} raised for ${person(requester).name.split(' ')[0]}`); }
      else { go('pticket', t.id); toast(`Request sent — ${t.id}`); }
    }});
}

    case 'problems':  return viewProblems();

function portalView(){

function render(){
  const app = $('#app');
  if (STATE.mode === 'agent'){

function parseHash(){
  const p = location.hash.replace(/^#\//,'').split('/');
  const mode = p[0]==='portal' ? 'portal' : 'agent';
  return { mode, view: p[1] || (mode==='agent'?'dashboard':'home'), id: p[2] || null };
}

function doAction(action, el){
  const t = STATE.route.view==='ticket' ? ticket(STATE.route.id) : null;
  const id = el?.dataset.id;
  switch(action){
    case 'closeModal': closeModal(); break;
    case 'palette': openPalette(); break;
    case 'newTicket': newTicketModal(); break;
    case 'notifications': notificationsModal(); break;
    case 'userMenu': userMenuModal(); break;
    case 'signOut': closeModal(); toast('Sign-out is disabled in this prototype','warn'); break;
    case 'openNav': $('#sidebar').classList.remove('-translate-x-full'); $('#navScrim').classList.remove('hidden'); break;
    case 'closeNav': $('#sidebar').classList.add('-translate-x-full'); $('#navScrim').classList.add('hidden'); break;
    case 'refresh': render(); toast('Queue refreshed'); break;
    case 'export': toast('CSV export queued — you will get an email'); break;
    case 'allTickets': STATE.savedView='all'; go('tickets'); break;
    case 'viewUnassigned': STATE.savedView='unassigned'; go('tickets'); break;
    case 'viewOverdue': STATE.savedView='overdue'; go('tickets'); break;
    case 'clearFilters': STATE.filters={ q:'',status:'',priority:'',agent:'',group:'',type:'',sort:'sla' }; STATE.savedView='all'; render(); break;
    case 'clearSelection': STATE.selection.clear(); render(); break;
    case 'backKB': go('kb'); break;
    case 'attach': toast('File picker is disabled in this prototype','warn'); break;
    case 'submitForm': { const fn = FORMS.current; if (fn) fn(readForm()); break; }

    /* composer */
    case 'send': sendReply(); break;
    case 'portalSend': portalSend(id); break;
    case 'portalSubmit': portalSubmit(); break;

    /* ticket actions */
    case 'resolveTicket': t.status='Resolved'; t.resolvedAt=new Date(); addSystemNote(t,'Status changed to Resolved'); render(); toast(`${t.id} resolved`); break;
    case 'reopenTicket': t.status='Open'; t.resolvedAt=null; addSystemNote(t,'Ticket reopened'); render(); toast(`${t.id} reopened`); break;
    case 'escalate': t.escalated=true; t.priority = t.priority==='Urgent'?'Urgent':'High'; addSystemNote(t,`Escalated to ${t.priority} priority`); render(); toast('Escalated — supervisor notified','warn'); break;
    case 'deleteTicket': confirmModal('Delete this ticket?', `${t.id} and its ${t.conv.length} messages will be removed. Requesters are not notified.`, 'Delete', ()=>{
        DB.tickets = DB.tickets.filter(x=>x.id!==t.id); closeModal(); go('tickets'); toast(`${t.id} deleted`,'bad'); }); break;

    case 'linkAsset': formModal({ title:'Link an asset', fields:[{ k:'a', label:'Asset', type:'select', opts:DB.assets.map(a=>[a.id,`${a.name} — ${a.id}`]) }],

        requester:a.user||'u1', type:'Incident', category:'Hardware', priority:'Medium', source:'Walk-up' }); nt.assets.push(a.id); go('ticket',nt.id); toast(`${nt.id} created`); break; }

    case 'bulkDelete': confirmModal('Delete selected tickets?', `${STATE.selection.size} tickets will be removed.`, 'Delete', ()=>{
        DB.tickets = DB.tickets.filter(x=>!STATE.selection.has(x.id)); const n=STATE.selection.size; STATE.selection.clear(); closeModal(); render(); toast(`${n} tickets deleted`,'bad'); }); break;
    case 'bulkMerge': { const ids=[...STATE.selection]; if(ids.length<2) return toast('Select at least two tickets to merge','warn');

        addSystemNote(target, `Merged ${ids.length-1} ticket(s) into this one`); STATE.selection.clear(); render(); toast(`Merged into ${target.id}`); break; }

          DB.articles.unshift({ id:'kb'+Date.now(), title:v.title, cat:v.cat, status:v.status, author:STATE.me, updated:new Date(), views:0, up:0, down:0, tags:[], body:`<p>${esc(v.body).replace(/\n/g,'</p><p>')}</p>` });
          closeModal(); go('kb'); toast('Article saved'); } }); break;

          DB.changes.unshift({ id:'CHG-0'+(312+DB.changes.length), title:v.title, risk:v.risk, state:'Awaiting approval', type:v.type, owner:STATE.me,

    case 'newProblem': formModal({ title:'Raise a problem', fields:[

    case 'addSla': formModal({ title:'New SLA policy', fields:[{ k:'name', label:'Policy name', required:true },

function confirmModal(title, body, label, onYes){
  FORMS.confirm = onYes;
  openModal({ title, body:`<p class="text-[13.5px] text-muted leading-relaxed">${body}</p>`,
    footer:`<button data-action="closeModal" class="h-9 px-3.5 rounded-lg border border-line text-[13px] font-medium hover:bg-white">Cancel</button>
            <button data-confirm="1" class="h-9 px-3.5 rounded-lg bg-alert text-white text-[13px] font-semibold hover:bg-[#A32A25]">${label}</button>` });
}
function mergeModal(sourceId){
  const others = DB.tickets.filter(t=>t.id!==sourceId && isOpen(t));
  formModal({ title:'Merge ticket', sub:`${sourceId} will be folded into the ticket you choose`,
    fields:[{ k:'target', label:'Merge into', type:'select', opts:others.map(t=>[t.id,`${t.id} — ${t.subject.slice(0,44)}`]) }],
    submit:'Merge', onSubmit(v){
      const src = ticket(sourceId), tgt = ticket(v.target);
      tgt.conv.push(...src.conv.map(c=>({ ...c, kind:c.kind==='description'?'reply':c.kind })));
      addSystemNote(tgt, `${sourceId} merged into this ticket`);
      DB.tickets = DB.tickets.filter(x=>x.id!==sourceId);
      closeModal(); go('ticket', tgt.id); toast(`${sourceId} merged into ${tgt.id}`);
    }});
}

function sendReply(){
  const t = ticket(STATE.route.id);
  const box = $('#composer');
  const body = (box?.value || '').trim();
  if (!body) return toast('Nothing to send yet','warn');
  const kind = STATE.composerTab === 'reply' ? 'reply' : 'note';
  t.conv.push({ kind, by:STATE.me, at:new Date(), body, atts:[] });
  t.updated = new Date();
  if (!t.agent){ t.agent = STATE.me; addSystemNote(t, `Assigned to ${agent(STATE.me).name}`); }
  if (kind === 'reply'){
    if (!t.respondedAt) t.respondedAt = new Date();
    if (t.status === 'New') t.status = 'Open';
  }
  if ($('[data-toggle="resolveOnSend"]')?.checked){
    t.status = 'Resolved'; t.resolvedAt = new Date(); addSystemNote(t,'Status changed to Resolved');
  }
  render();
  toast(kind === 'reply' ? 'Reply sent to requester' : 'Private note saved');
}
function portalSend(id){
  const t = ticket(id);
  const box = $('#portalReply');
  const body = (box?.value || '').trim();
  if (!body) return toast('Write something first','warn');
  t.conv.push({ kind:'reply', by:STATE.requester, at:new Date(), body, atts:[] });
  t.updated = new Date();
  if (t.status === 'Pending') t.status = 'Open';
  render(); toast('Sent — the service desk has been notified');
}
function portalSubmit(){
  const f = $('#portalForm'); if (!f) return;
  const v = {}; new FormData(f).forEach((x,k)=>v[k]=String(x).trim());
  if (!v.subject || !v.body) return toast('A subject and some detail are needed','warn');
  const t = createTicket({ subject:v.subject, body:v.body, requester:STATE.requester, priority:v.priority, category:v.category, type:'Incident', source:'Portal' });
  go('pticket', t.id);
  toast(`${t.id} raised — we are on it`);
}
function portalSearchRender(q){
  const box = $('#portalResults'); if (!box) return;
  q = q.trim().toLowerCase();
  if (!q){ box.classList.add('hidden'); return; }
  const arts = DB.articles.filter(a=>a.status==='Published' && (a.title+a.cat+a.tags.join(' ')).toLowerCase().includes(q)).slice(0,4);
  const items = DB.catalog.filter(c=>(c.name+c.cat+c.desc).toLowerCase().includes(q)).slice(0,3);
  box.classList.remove('hidden');
  box.innerHTML = (arts.length||items.length) ? `
    ${arts.length?`<div class="px-3 pt-2.5 pb-1 text-[11px] font-semibold uppercase tracking-[.09em] text-faint">Answers</div>`:''}
    ${arts.map(a=>`<button data-particle="${a.id}" class="w-full flex items-center gap-2.5 px-3 h-10 hover:bg-canvas text-left">
      <span class="text-faint">${icon('book','w-4 h-4')}</span><span class="text-[13px] truncate flex-1">${esc(a.title)}</span>
      <span class="text-[11px] text-faint shrink-0">${esc(a.cat)}</span></button>`).join('')}
    ${items.length?`<div class="px-3 pt-2.5 pb-1 text-[11px] font-semibold uppercase tracking-[.09em] text-faint border-t border-line">Services</div>`:''}
    ${items.map(c=>`<button data-catalog="${c.id}" class="w-full flex items-center gap-2.5 px-3 h-10 hover:bg-canvas text-left">
      <span class="text-brand">${icon(c.icon,'w-4 h-4')}</span><span class="text-[13px] truncate flex-1">${esc(c.name)}</span>
      <span class="text-[11px] text-faint shrink-0">${esc(c.sla)}</span></button>`).join('')}`
    : `<div class="px-3 py-4 text-[13px] text-muted">No answer for “${esc(q)}”. <button data-pnav="newticket" class="text-brand font-medium">Raise a ticket instead</button></div>`;
}

/* ============================================================
   Event wiring
   ============================================================ */
document.addEventListener('click', e => {
  const hit = sel => e.target.closest(sel);
  let el;
  if (el = hit('[data-confirm]')){ const fn = FORMS.confirm; if (fn) fn(); return; }
  if (el = hit('[data-mode]')){ closeModal(); switchMode(el.dataset.mode); return; }
  if (el = hit('[data-palette]')){ const [kind,val] = JSON.parse(el.dataset.palette); closeModal();
    if (kind==='nav') go(val); else if (kind==='ticket') go('ticket',val); else if (kind==='article') go('article',val);
    else if (kind==='asset'){ go('assets'); assetModal(val); } else if (kind==='user'){ requesterHistoryModal(val); } return; }
  if (el = hit('[data-nav]')){ go(el.dataset.nav); return; }
  if (el = hit('[data-pnav]')){ go(el.dataset.pnav); return; }
  if (el = hit('[data-open]')){ closeModal(); if (STATE.mode!=='agent') STATE.mode='agent'; go('ticket', el.dataset.open); return; }
  if (el = hit('[data-pticket]')){ go('pticket', el.dataset.pticket); return; }
  if (el = hit('[data-particle]')){ closeModal(); go('article', el.dataset.particle); return; }
  if (el = hit('[data-article]')){ go('article', el.dataset.article); return; }
  if (el = hit('[data-asset]')){ assetModal(el.dataset.asset); return; }
  if (el = hit('[data-menu]')){ rowMenu(el.dataset.menu); return; }
  if (el = hit('[data-view]')){ STATE.savedView = el.dataset.view; STATE.selection.clear(); render(); return; }
  if (el = hit('[data-tab]')){ STATE.composerTab = el.dataset.tab; render(); return; }
  if (el = hit('[data-admin]')){ STATE.adminTab = el.dataset.admin; render(); return; }
  if (el = hit('[data-kbcat]')){ STATE.kbCat = el.dataset.kbcat; render(); return; }
  if (el = hit('[data-catcat]')){ STATE.catalogCat = el.dataset.catcat; render(); return; }
  if (el = hit('[data-ptab]')){ STATE.portalTab = el.dataset.ptab; render(); return; }
  if (el = hit('[data-catalog]')){ closeModal(); catalogRequestModal(el.dataset.catalog, STATE.mode==='agent'); return; }
  if (el = hit('[data-approve]')){ const c = DB.changes.find(x=>x.id===el.dataset.approve);
    c.approvals.forEach(a=>{ if(a.status==='Pending') a.status='Approved'; }); c.state='Scheduled'; render(); toast(`${c.id} approved and scheduled`); return; }
  if (el = hit('[data-reject]')){ const c = DB.changes.find(x=>x.id===el.dataset.reject);
    c.approvals.forEach(a=>{ if(a.status==='Pending') a.status='Rejected'; }); c.state='Rejected'; render(); toast(`${c.id} rejected`,'bad'); return; }
  if (el = hit('[data-vote]')){ const a = article(el.dataset.id);
    el.dataset.vote==='up' ? a.up++ : a.down++; toast(el.dataset.vote==='up'?'Thanks — noted':'Thanks — we will rework this one'); render(); return; }
  if (el = hit('[data-rate]')){ const t = ticket(el.dataset.id); t.csat = { score:Number(el.dataset.rate), comment:'' }; render(); toast('Thanks for the feedback'); return; }
  if (el = hit('[data-toggle-row]')){
    const kind = el.dataset.toggleRow, id = el.dataset.id;
    const src = kind==='agent' ? DB.agents : kind==='sla' ? DB.slas : DB.automations;
    const row = src.find(x=>x.id===id); row.active = !row.active; render();
    toast(`${row.name} ${row.active?'enabled':'disabled'}`, row.active?'ok':'warn'); return; }
  if (el = hit('#navScrim')){ doAction('closeNav'); return; }
  if (el = hit('[data-action]')){ doAction(el.dataset.action, el); return; }
});

document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.filter){
    const k = el.dataset.filter;
    if (k === 'assetType'){ STATE.filters.assetType = el.value; render(); return; }
    if (k === 'range'){ toast('Reporting range updated'); return; }
    STATE.filters[k] = el.value; renderTicketList(); return;
  }
  if (el.dataset.check){
    const id = el.dataset.check;
    if (id === '__all'){ const list = filteredTickets();
      el.checked ? list.forEach(t=>STATE.selection.add(t.id)) : STATE.selection.clear(); render(); return; }
    el.checked ? STATE.selection.add(id) : STATE.selection.delete(id);
    renderTicketList(); return;
  }
  if (el.dataset.bulk){
    const val = el.value; if (!val) return;
    const ids = [...STATE.selection];
    ids.forEach(i => { const t = ticket(i);
      if (el.dataset.bulk==='assign'){ t.agent = val; addSystemNote(t, `Assigned to ${agent(val).name}`); }
      if (el.dataset.bulk==='status'){ t.status = val; if(val==='Resolved') t.resolvedAt=new Date(); addSystemNote(t, `Status changed to ${val}`); }
      if (el.dataset.bulk==='priority'){ t.priority = val; addSystemNote(t, `Priority set to ${val}`); }
    });
    STATE.selection.clear(); render(); toast(`${ids.length} tickets updated`); return;
  }
  if (el.dataset.prop){
    const t = ticket(STATE.route.id), k = el.dataset.prop, v = el.value;
    if (k === 'agent'){ t.agent = v || null; addSystemNote(t, v ? `Assigned to ${agent(v).name}` : 'Unassigned'); }
    else if (k === 'group'){ t.group = v; addSystemNote(t, `Moved to ${group(v).name}`); }
    else { if (k==='status' && v==='Resolved') t.resolvedAt = new Date(); if (k==='status' && v!=='Resolved') t.resolvedAt = null;
      t[k] = v; addSystemNote(t, `${k[0].toUpperCase()+k.slice(1)} set to ${v}`); }
    t.updated = new Date(); render(); toast('Ticket updated'); return;
  }
  if (el.dataset.task !== undefined && el.type === 'checkbox' && el.dataset.task !== ''){
    const t = ticket(STATE.route.id); t.tasks[Number(el.dataset.task)].done = el.checked; render(); return;
  }
  if (el.dataset.action === 'canned'){
    const c = DB.canned.find(x=>x.id===el.value); if (!c) return;
    const box = $('#composer'); if (box){ box.value = c.body; box.focus(); } el.value=''; return;
  }
  if (el.dataset.action === 'setAgent'){ STATE.me = el.value; render(); toast(`Now working as ${agent(el.value).name}`); return; }
  if (el.dataset.action === 'setRequester'){ STATE.requester = el.value; render(); toast(`Portal shown as ${user(el.value).name}`); return; }
});

document.addEventListener('input', e => {
  const el = e.target;
  if (el.id === 'ticketSearch'){ STATE.filters.q = el.value; renderTicketList(); return; }
  if (el.id === 'assetSearch'){
    STATE.filters.assetQ = el.value; const v = el.value; render();
    const again = $('#assetSearch'); if (again){ again.focus(); again.setSelectionRange(v.length, v.length); } return;
  }
  if (el.id === 'portalSearch'){ portalSearchRender(el.value); return; }
});

document.addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k'){ e.preventDefault(); openPalette(); return; }
  if (e.key === 'Escape'){ closeModal(); const s = $('#sidebar'); if (s) doAction('closeNav'); return; }
  if ((e.metaKey || e.ctrlKey) && e.key === 'Enter'){
    if (document.activeElement?.id === 'composer'){ e.preventDefault(); sendReply(); }
    if (document.activeElement?.id === 'portalReply'){ e.preventDefault(); portalSend(STATE.route.id); }
  }
});

/* live SLA clocks */
setInterval(() => {
  $$('[data-countdown]').forEach(el => {
    const t = ticket(el.dataset.countdown); if (!t) return;
    el.textContent = slaLabel(t); el.style.color = SLA_COLOR[sla(t).state];
  });
  if (STATE.mode === 'agent' && STATE.route.view === 'tickets' && !STATE.selection.size) renderTicketList();
}, 30000);

window.addEventListener('hashchange', () => {
  const r = parseHash();
  if (r.mode !== STATE.mode || r.view !== STATE.route.view || r.id !== STATE.route.id){
    STATE.mode = r.mode; STATE.route = { view:r.view, id:r.id }; render();
  }
});

/* boot */
(function init(){
  const r = parseHash();
  STATE.mode = r.mode; STATE.route = { view:r.view, id:r.id };
  if (!location.hash) location.hash = '#/agent/dashboard';
  render();
})();
</script>
</body>
</html>
