# TicketHub — the whole stack, HTTPS included.
#
#   cp docker/.env.docker.example .env.docker   # set TICKETHUB_DOMAIN + passwords
#   docker compose up -d --build
#   docker compose exec app php spark tickethub:setup --email you@company.com
#
# Then open https://<TICKETHUB_DOMAIN>/ — or http://localhost/ when no domain
# is set. Changing .env.docker and re-running `docker compose up -d` applies
# the new settings. Certificate options: docs/https.md.
#
# caddy  the front door: ports 80 + 443, HTTPS certificates (see docker/caddy/start.sh)
# app    Apache + PHP 8.4 serving public/, migrations run on start (see docker/entrypoint.sh)
# db     MariaDB 11 with a persistent volume
# cron   same image as app, runs the schedulers in a loop (see docker/cron.sh)
#
# Ports 80/443 already taken on this host? Put the mapping you want in a
# docker-compose.override.yml (e.g. "8080:80"), and set APP_BASE_URL to match.

services:
  caddy:
    build: docker/caddy
    image: tickethub-caddy:latest
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3
    env_file:
      - .env.docker
    depends_on:
      app:
        condition: service_healthy
    volumes:
      # Certificates, ACME account and the internal CA. Keep this volume:
      # losing it means re-issuing certificates (and a new internal root).
      - caddy_data:/data
      - caddy_config:/config
      # TICKETHUB_TLS=files: your certificate and key (read-only).
      - ./docker/certs:/certs:ro

  app:
    build: .
    image: tickethub:latest
    restart: unless-stopped
    # No published ports: everything arrives through caddy, which is why the
    # app trusts X-Forwarded-* from the private ranges (docker/env-sync.php).
    expose:
      - "80"
    env_file:
      - .env.docker
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Uploaded attachments, sessions, logs and the generated .env survive restarts.
      - app_writable:/var/www/html/writable
      # Read-only view of Caddy's data, so Admin → Address & HTTPS can offer the
      # internal CA's root certificate for download (TICKETHUB_TLS=internal).
      - caddy_data:/caddy-data:ro
      # To manage .env yourself instead of the generated one, uncomment:
      # - ./.env:/var/www/html/.env:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost/login"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  db:
    image: mariadb:11
    restart: unless-stopped
    # MARIADB_* (database, user, passwords) come from .env.docker; keep them in
    # sync with the DB_* values the app uses.
    env_file:
      - .env.docker
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  cron:
    image: tickethub:latest
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      # The app container owns migrations; the scheduler only waits for the DB.
      SKIP_MIGRATIONS: "1"
    # The entrypoint runs as root (waits for the DB, links the shared .env),
    # then the scheduler drops to www-data: it parses untrusted inbound mail
    # and attachments, and files it writes to the shared volume must stay
    # owned by the web user.
    command: ["setpriv", "--reuid=www-data", "--regid=www-data", "--init-groups", "sh", "/var/www/html/docker/cron.sh"]
    # The image's healthcheck requests the web page; no web server runs here,
    # so it would report "unhealthy" forever. The loop logs to writable/logs/cron.log.
    healthcheck:
      disable: true
    depends_on:
      app:
        condition: service_healthy
      db:
        condition: service_healthy
    volumes:
      - app_writable:/var/www/html/writable

volumes:
  db_data:
  app_writable:
  caddy_data:
  caddy_config:
