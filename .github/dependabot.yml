version: 2
updates:
  # Dev dependencies only (PHPUnit, php-cs-fixer, coding standard); the
  # framework itself is vendored in system/ and upgraded by hand.
  - package-ecosystem: composer
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: ["dependencies", "composer"]
    groups:
      dev-tooling:
        dependency-type: development
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    labels: ["dependencies", "github-actions"]

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: monthly
    labels: ["dependencies", "docker"]
