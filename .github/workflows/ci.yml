name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: PHP syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: none
          coverage: none

      - name: php -l over app/ and tests/
        run: |
          set -o pipefail
          status=0
          while IFS= read -r -d '' file; do
            if ! out=$(php -l "$file" 2>&1); then
              echo "$out"
              status=1
            fi
          done < <(find app tests -name '*.php' -print0)
          exit $status

  css:
    name: Built CSS is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - run: npm ci --no-audit --no-fund

      # public/assets/css/tailwind.css is committed so running TicketHub never
      # needs Node. Rebuild it and fail if a class was added without `npm run build:css`.
      - name: Rebuild and compare
        run: |
          npm run build:css
          git diff --exit-code --stat -- public/assets/css/tailwind.css \
            || { echo "::error::public/assets/css/tailwind.css is stale. Run 'npm run build:css' and commit the result."; exit 1; }

  tests:
    name: PHPUnit (PHP ${{ matrix.php }}, MariaDB 11)
    runs-on: ubuntu-latest
    needs: lint

    # 8.3 is the supported minimum (composer.json); 8.4 is what the Docker
    # image ships; 8.5 catches deprecations before users hit them.
    strategy:
      fail-fast: false
      matrix:
        php: ["8.3", "8.4", "8.5"]

    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: tickethub_test
          MARIADB_USER: tickethub
          MARIADB_PASSWORD: tickethub
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      TH_TEST_DB_HOST: 127.0.0.1
      TH_TEST_DB_PORT: "3306"
      TH_TEST_DB_NAME: tickethub_test
      TH_TEST_DB_USER: tickethub
      TH_TEST_DB_PASSWORD: tickethub

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: intl, mbstring, mysqli, gd, ldap, zip, curl, json
          coverage: none
          tools: composer:v2

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Wait for MariaDB
        run: |
          for i in $(seq 1 30); do
            if mariadb -h127.0.0.1 -utickethub -ptickethub -e 'SELECT 1' tickethub_test >/dev/null 2>&1 \
               || mysql -h127.0.0.1 -utickethub -ptickethub -e 'SELECT 1' tickethub_test >/dev/null 2>&1; then
              echo "MariaDB ready"; exit 0
            fi
            sleep 2
          done
          echo "MariaDB did not become ready"; exit 1

      - name: Prepare writable/
        run: mkdir -p writable/cache writable/logs writable/session writable/uploads writable/debugbar

      # --fail-on-skipped: the feature tests skip themselves when the test database
      # is unreachable; in CI that must be a failure, never a silent pass.
      - name: PHPUnit
        run: php vendor/bin/phpunit --no-coverage --fail-on-skipped --display-skipped

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: phpunit-logs-php${{ matrix.php }}
          path: build/logs/
          if-no-files-found: ignore

  stack:
    name: Docker stack (HTTPS + sign-in)
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Build the Caddy image
        run: docker build -t tickethub-caddy:latest docker/caddy

      # Every TICKETHUB_TLS mode must produce a config Caddy accepts, and a
      # broken setting must stop with a message instead of a bad config.
      - name: Validate the generated Caddy config for every mode
        run: |
          set -eu
          mkdir -p /tmp/certs
          openssl req -x509 -newkey rsa:2048 -nodes -days 30 -subj "/CN=tickethub.test" \
            -addext "subjectAltName=DNS:tickethub.test" -keyout /tmp/certs/tls.key -out /tmp/certs/tls.crt 2>/dev/null
          v() { echo "::group::$*"; docker run --rm -v /tmp/certs:/certs:ro "$@" tickethub-caddy:latest tickethub-caddy validate; echo "::endgroup::"; }
          v -e TICKETHUB_DOMAIN=
          v -e TICKETHUB_DOMAIN=tickethub.test -e TICKETHUB_TLS=auto -e TICKETHUB_ACME_EMAIL=ci@example.com
          v -e TICKETHUB_DOMAIN=tickethub.test -e TICKETHUB_TLS=internal
          v -e TICKETHUB_DOMAIN=tickethub.test -e TICKETHUB_TLS=files
          v -e TICKETHUB_DOMAIN=tickethub.test -e TICKETHUB_TLS=upstream -e TICKETHUB_UPSTREAM_PROXIES=10.0.0.5/32
          # Dummy credentials in the providers' real formats (the modules check the shape).
          G=00000000-0000-0000-0000-000000000000
          v -e TICKETHUB_DOMAIN=tickethub.test -e TICKETHUB_TLS=dns -e TICKETHUB_DNS_PROVIDER=cloudflare -e CF_API_TOKEN=abcdefghijklmnopqrstuvwxyz0123456789ABCD
          v -e TICKETHUB_DOMAIN=tickethub.test -e TICKETHUB_TLS=dns -e TICKETHUB_DNS_PROVIDER=azure \
            -e AZURE_TENANT_ID=$G -e AZURE_CLIENT_ID=$G -e AZURE_CLIENT_SECRET=dummy-secret -e AZURE_SUBSCRIPTION_ID=$G -e AZURE_RESOURCE_GROUP_NAME=dns-rg
          v -e TICKETHUB_DOMAIN=tickethub.test -e TICKETHUB_TLS=dns -e TICKETHUB_DNS_PROVIDER=route53 -e AWS_ACCESS_KEY_ID=AKIAIOSFODNN7EXAMPLE -e AWS_SECRET_ACCESS_KEY=wJalrXUtnFEMIK7MDENGbPxRfiCYEXAMPLEKEY
          v -e TICKETHUB_DOMAIN=tickethub.test -e TICKETHUB_TLS=dns -e TICKETHUB_DNS_PROVIDER=route53
          bad() {
            if out=$(docker run --rm "$@" tickethub-caddy:latest tickethub-caddy validate 2>&1); then
              echo "::error::expected failure for: $*"; echo "$out"; exit 1
            fi
            echo "$out" | grep -q 'ERROR:' || { echo "::error::no explanation for: $*"; echo "$out"; exit 1; }
            echo "rejected as expected: $(echo "$out" | grep ERROR:)"
          }
          bad -e TICKETHUB_DOMAIN=tickethub.test -e TICKETHUB_TLS=files
          bad -e TICKETHUB_DOMAIN=tickethub.test -e TICKETHUB_TLS=dns
          bad -e TICKETHUB_DOMAIN=tickethub.test -e TICKETHUB_TLS=dns -e TICKETHUB_DNS_PROVIDER=cloudflare
          bad -e TICKETHUB_DOMAIN=tickethub.test -e TICKETHUB_TLS=bogus
          bad -e "TICKETHUB_DOMAIN=not a host"

      - name: Configure the stack (internal CA on tickethub.test)
        run: |
          cp docker/.env.docker.example .env.docker
          sed -i -e 's/^TICKETHUB_DOMAIN=.*/TICKETHUB_DOMAIN=tickethub.test/' -e 's/^TICKETHUB_TLS=.*/TICKETHUB_TLS=internal/' .env.docker
          grep -E '^TICKETHUB_' .env.docker

      - name: Start it
        run: |
          docker compose up -d --build --wait --wait-timeout 300
          docker compose exec -T app php -m | grep -xE 'intl|gd|ldap|zip|mysqli|mbstring' | sort | tr '\n' ' '; echo

      - name: HTTPS, redirect, certificate and sign-in
        run: |
          set -eu
          R="--resolve tickethub.test:443:127.0.0.1 --resolve tickethub.test:80:127.0.0.1"
          # The web server runs as www-data: it must see the same settings as root
          # (a world-writable docroot once made the kernel hide the .env symlink from it).
          docker compose exec -T -u www-data app php spark tickethub:url | tee /tmp/url-www.txt
          grep -q 'https://tickethub.test/' /tmp/url-www.txt || { echo "::error::the web user does not see the generated .env"; exit 1; }
          code=$(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' $R http://tickethub.test/login)
          echo "http  -> $code"; case "$code" in 30[178]\ https://tickethub.test/login) ;; *) echo "::error::http did not redirect to https"; exit 1;; esac
          curl -skfsS -D /tmp/h $R https://tickethub.test/login -o /tmp/login.html
          grep -qi '^strict-transport-security:' /tmp/h || { echo "::error::no HSTS header over https"; cat /tmp/h; exit 1; }
          # The app, not just Caddy, must see the request as secure (trusted proxy).
          docker compose exec -T app php spark tickethub:url | tee /tmp/url.txt
          grep -q 'https://tickethub.test/' /tmp/url.txt
          grep -q 'HTTPS enforced:   yes' /tmp/url.txt
          # Certificate issued by the internal CA, as the Address & HTTPS tab sees it.
          docker compose exec -T app php -r 'require "app/Libraries/SiteAddress.php"; echo json_encode(App\Libraries\SiteAddress::inspect("caddy", 443, "tickethub.test"));' | tee /tmp/cert.json
          jq -e '(.names | index("tickethub.test")) and (.issuerCN | test("TicketHub"))' /tmp/cert.json
          # Root certificate published for the download button (within ~30 s).
          for i in $(seq 1 30); do docker compose exec -T app test -s /caddy-data/tickethub-root-ca.crt && break; sleep 2; done
          docker compose exec -T app grep -q 'BEGIN CERTIFICATE' /caddy-data/tickethub-root-ca.crt
          # A real sign-in over HTTPS: Secure cookies + CSRF + proxy trust together.
          pw=$(docker compose exec -T app php spark tickethub:setup --email ci-admin@example.com | awk '/Temporary password/{getline; print $1}')
          test -n "$pw"
          J=/tmp/jar; rm -f $J
          tok=$(curl -sk -c $J -b $J $R https://tickethub.test/login | grep -o 'name="csrf_[a-z_]*" value="[^"]*"' | head -1)
          name=$(echo "$tok" | sed 's/name="\([^"]*\)".*/\1/'); val=$(echo "$tok" | sed 's/.*value="\([^"]*\)"/\1/')
          loc=$(curl -sk -c $J -b $J $R -o /dev/null -w '%{redirect_url}' --data-urlencode "$name=$val" \
                --data-urlencode "email=ci-admin@example.com" --data-urlencode "password=$pw" https://tickethub.test/login)
          echo "sign-in -> $loc"
          case "$loc" in https://tickethub.test/*) ;; *) echo "::error::sign-in did not stay on https"; exit 1;; esac
          case "$loc" in */login) echo "::error::sign-in was rejected"; exit 1;; esac
          case "$loc" in *index.php*) echo "::error::links carry /index.php/ (app.indexPage)"; exit 1;; esac
          grep -q '#HttpOnly_tickethub.test.*TRUE' $J || { echo "::error::session cookie is not Secure"; cat $J; exit 1; }

      - name: Switch to the local demo; the change must apply on restart
        run: |
          set -eu
          sed -i 's/^TICKETHUB_DOMAIN=.*/TICKETHUB_DOMAIN=/' .env.docker
          docker compose up -d --wait --wait-timeout 300
          docker compose exec -T app php spark tickethub:url | tee /tmp/url.txt
          grep -q 'http://localhost/' /tmp/url.txt
          grep -q 'HTTPS enforced:   no' /tmp/url.txt
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost/login); echo "http://localhost/login -> $code"; test "$code" = 200
          pw=$(docker compose exec -T app php spark tickethub:setup --email ci-admin@example.com --force | awk '/Temporary password/{getline; print $1}')
          J=/tmp/jar2; rm -f $J
          tok=$(curl -s -c $J -b $J http://localhost/login | grep -o 'name="csrf_[a-z_]*" value="[^"]*"' | head -1)
          name=$(echo "$tok" | sed 's/name="\([^"]*\)".*/\1/'); val=$(echo "$tok" | sed 's/.*value="\([^"]*\)"/\1/')
          loc=$(curl -s -c $J -b $J -o /dev/null -w '%{redirect_url}' --data-urlencode "$name=$val" \
                --data-urlencode "email=ci-admin@example.com" --data-urlencode "password=$pw" http://localhost/login)
          echo "sign-in -> $loc"
          case "$loc" in http://localhost/*) ;; *) echo "::error::unexpected redirect"; exit 1;; esac
          case "$loc" in */login) echo "::error::sign-in over plain http was rejected (Secure cookie?)"; exit 1;; esac

      - name: Logs
        if: failure()
        run: docker compose logs --no-color --tail 200

      - name: Stop
        if: always()
        run: docker compose down -v

  docker-build:
    name: Docker image builds
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: docker build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: tickethub:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
